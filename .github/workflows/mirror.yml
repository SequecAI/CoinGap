name: Mirror to Personal Repo for Free Vercel Deploy

on:
  push:
    branches: [ "main" ] # 팀 레포의 main 브랜치에 push나 merge가 일어나면 발동!

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Team Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Personal Repo (SequecAI/CoinGap)
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          echo "PERSONAL_TOKEN length: ${#PERSONAL_TOKEN}"
          if [ -z "$PERSONAL_TOKEN" ]; then
            echo "::error::PERSONAL_TOKEN secret is empty or not set on this repository"
            exit 1
          fi

          TARGET_URL="https://x-access-token:${PERSONAL_TOKEN}@github.com/SequecAI/CoinGap.git"

          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

          git remote add target "$TARGET_URL"
          git push --force --prune target main